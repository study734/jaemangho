name = "jaemangho-operations"
main = "worker.mjs"
compatibility_date = "2026-10-11"
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "RUNNER"
class_name = "OperationsRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OperationsRunner"]

[vars]
OPS_BACKUP_ENABLED = "0"
