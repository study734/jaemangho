name: Recovery rehearsal

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '41 18 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backup-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: node:24-trixie
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@postgres:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: PostgreSQL 17 복구 도구 설치
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends postgresql-client-17
          pg_dump --version
          pg_restore --version
      - run: npm ci
      - name: 가짜 데이터 백업·복구·스키마 검증
        run: node scripts/rehearse-backup.mjs
