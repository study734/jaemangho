name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * 1'
  push:
    branches: [main]

# 워크플로 토큰은 읽기 전용으로 둔다 (저장소 기본값에 기대지 않고 명시한다)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    needs: [workflow-policy, dependency-review]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # DB가 필요한 통합 테스트용 Postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/test
    steps:
      - name: 필수 정책 검사 결과 확인
        env:
          POLICY_RESULT: ${{ needs.workflow-policy.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$POLICY_RESULT" = success
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            test "$DEPENDENCY_RESULT" = success
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test -- --maxWorkers=4
      - name: 비밀값 등록 도구의 숨김 입력·키 보존 검사
        run: python3 -m unittest discover -s scripts -p register_ops_secrets_test.py
      - run: npm run build

  # 실제 브라우저(Chromium)로 로그인 보호·소환사 목록·관리자 화면을 시험한다.
  # 운영과 같은 방식(마이그레이션 -> next build -> next start)으로 서버를 띄운다. 디스코드와 Riot은 쓰지 않는다.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: 실패 시 리포트(스크린샷, 트레이스) 업로드
        if: failure() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Dependabot의 minor·patch 묶음 PR을 필수 검사(check·e2e) 통과 뒤 바로 squash 머지한다.
  # 비공개 저장소의 무료 플랜에는 GitHub 자동 머지(Allow auto-merge)가 없어 이 작업이 대신한다.
  # 묶음 이름은 .github/dependabot.yml에서 update-types가 minor·patch뿐인 groups와 같아야 한다(scripts/workflows.test.ts가 확인).
  # 메이저 업그레이드와 security-fixes 묶음(메이저 포함 가능)은 사람이 머지한다. 검사 중 새 커밋이 오면 머지하지 않는다.
  # GITHUB_TOKEN으로 머지하므로 그 main 커밋에서는 Actions가 다시 돌지 않는다(같은 커밋을 이 실행이 이미 검사했다).
  dependabot-merge:
    needs: [check, e2e]
    # PR 작성자로 판단한다(github.actor는 위조 가능하다고 zizmor가 막는다).
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: minor·patch 묶음이면 머지
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$HEAD_REF" in
            dependabot/npm_and_yarn/minor-and-patch-*|dependabot/github_actions/action-updates-*)
              gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
              echo "필수 검사 통과 후 머지했습니다." >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "자동 머지 대상 아님(메이저·보안 묶음 등): 사람이 검토합니다." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  dependency-review:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # 개인 소유 비공개 저장소에서도 실행되며 개발 의존성까지 검사한다.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  workflow-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Workflow 문법·표현식 검사
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' '/tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      - name: 기존 마이그레이션 보호
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
        run: node scripts/check-migrations.mjs "$BASE_SHA" HEAD
