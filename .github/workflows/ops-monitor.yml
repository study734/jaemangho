name: Operations monitor

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: 이전 알림 상태 복원
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ops-monitor
          key: ops-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ops-monitor-state-
      - name: 사이트·DB·운영 상태 점검
        run: node scripts/monitor.mjs https://jaemangho.vercel.app
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
      - name: 알림 상태 저장
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ops-monitor
          key: ops-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
