name: Operations monitor

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 이전 알림 상태 복원
        uses: actions/cache/restore@v5
        with:
          path: .ops-monitor
          key: ops-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ops-monitor-state-
      - name: 사이트·DB·운영 상태 점검
        run: node scripts/monitor.mjs https://jaemangho.vercel.app
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
      - name: 알림 상태 저장
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ops-monitor
          key: ops-monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
